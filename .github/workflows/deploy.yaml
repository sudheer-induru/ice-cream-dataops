name: Deploy Toolkit

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    paths:
      - ice-cream-dataops/**
  workflow_dispatch:
    inputs:
      environment:
        description: Pick one
        required: false
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  build-modules:
    name: Build & Deploy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: cognite/toolkit:0.9.75
    strategy:
      matrix:
        include:
          - environment: ${{ inputs.environment != '' && inputs.environment || 'dev' }}

    environment: ${{ matrix.environment }}
    env:
      CDF_PROJECT: ${{ matrix.environment == 'prod' && 'cdf-bootcamp-72-prod' || 'sudheeriv-dev' }}
      CDF_CLUSTER: ${{ matrix.environment == 'prod' && 'westeurope-1' || 'bluefield' }}
      IDP_TENANT_ID: ${{ matrix.environment == 'prod' && '16e3985b-ebe8-4e24-9da4-933e21a9fc81' || vars.IDP_TENANT_ID }}
      IDP_TOKEN_URL: ${{ matrix.environment == 'prod' && 'https://login.microsoftonline.com/16e3985b-ebe8-4e24-9da4-933e21a9fc81/oauth2/v2.0/token' || vars.IDP_TOKEN_URL }}
      IDP_SCOPES: ${{ vars.IDP_SCOPES }}
      LOGIN_FLOW: client_credentials

      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

      DATA_DEVELOPER_SOURCE_ID: ${{ vars.DATA_DEVELOPER_SOURCE_ID }}

      DATA_PIPELINE_OEE_CLIENT_ID: ${{ vars.DATA_PIPELINE_OEE_CLIENT_ID }}
      DATA_PIPELINE_OEE_CLIENT_SECRET: ${{ secrets.DATA_PIPELINE_OEE_CLIENT_SECRET }}
      DATA_PIPELINE_OEE_SOURCE_ID: ${{ vars.DATA_PIPELINE_OEE_SOURCE_ID }}

      ICAPI_EXTRACTORS_CLIENT_ID: ${{ vars.ICAPI_EXTRACTORS_CLIENT_ID }}
      ICAPI_EXTRACTORS_CLIENT_SECRET: ${{ secrets.ICAPI_EXTRACTORS_CLIENT_SECRET }}
      ICAPI_EXTRACTORS_SOURCE_ID: ${{ vars.ICAPI_EXTRACTORS_SOURCE_ID }}

    steps:
      - uses: actions/checkout@v4
      - name: Verify and Update Toolkit Authorization
        run: yes | cdf auth verify
      - name: Build Toolkit Configurations
        run: cdf build --env=${{ matrix.environment }}
      - name: Deploy Toolkit Configurations
        run: cdf deploy --cdf-project="$CDF_PROJECT"
